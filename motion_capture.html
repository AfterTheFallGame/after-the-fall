<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After the Fall — Motion Capture</title><style>body{background:#16191e;color:#eee;font:16px system-ui;max-width:850px;margin:24px auto;padding:16px}button,input{font:inherit;margin:8px 4px;padding:10px}button{background:#ddd;color:#111;border:0;border-radius:8px}canvas{width:100%;max-height:65vh;object-fit:contain;background:#090909}p{line-height:1.5}video{display:none}</style><h1>AFTER THE FALL — Motion Capture</h1><p>Выбери оригинальное видео передвижения героя. Для первого запуска нужен интернет: модель MediaPipe загружается с CDN. Видео обрабатывается в браузере.</p><input id="file" type="file" accept="video/*"><button id="run" disabled>Извлечь движения</button><button id="save" disabled>Сохранить JSON</button><p id="status">Загрузка библиотеки…</p><video id="v" muted playsinline preload="auto"></video><canvas id="c"></canvas><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" onerror="document.getElementById('status').textContent='Не удалось загрузить MediaPipe. Проверь интернет.'"></script><script>
const $=id=>document.getElementById(id),v=$('v'),c=$('c'),ctx=c.getContext('2d'),s=$('status');let frames=[],pose,busy=false,latest=null;const edges=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[29,31],[24,26],[26,28],[28,30],[30,32],[0,7],[0,8]];if(typeof Pose!=='undefined'){pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/'+f});pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(r=>{latest=r.poseLandmarks?{landmarks:r.poseLandmarks.map(p=>[p.x,p.y,p.z,p.visibility??null]),world:r.poseWorldLandmarks?.map(p=>[p.x,p.y,p.z,p.visibility??null])??null}:null;ctx.drawImage(v,0,0,c.width,c.height);if(!latest)return;const p=latest.landmarks;ctx.strokeStyle='#7effa0';ctx.lineWidth=3;for(const [a,b] of edges){if(p[a][3]<.35||p[b][3]<.35)continue;ctx.beginPath();ctx.moveTo(p[a][0]*c.width,p[a][1]*c.height);ctx.lineTo(p[b][0]*c.width,p[b][1]*c.height);ctx.stroke()}ctx.fillStyle='#ffd15c';for(const q of p){if(q[3]<.35)continue;ctx.beginPath();ctx.arc(q[0]*c.width,q[1]*c.height,4,0,Math.PI*2);ctx.fill()}});s.textContent='Выбери видео.'}let url;$('file').onchange=()=>{if(busy)return;const f=$('file').files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;frames=[];$('save').disabled=true};v.onloadeddata=()=>{c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);$('run').disabled=!pose;s.textContent=`Видео: ${v.duration.toFixed(2)} с`};function seek(t){return new Promise((ok,fail)=>{if(Math.abs(v.currentTime-t)<.0001&&v.readyState>=2){ok();return}const timer=setTimeout(()=>{v.removeEventListener('seeked',done);fail(Error('Тайм-аут чтения кадра'))},10000);function done(){clearTimeout(timer);ok()}v.addEventListener('seeked',done,{once:true});v.currentTime=t})}$('run').onclick=async()=>{if(busy)return;busy=true;$('run').disabled=$('file').disabled=$('save').disabled=true;frames=[];try{const fps=30,n=Math.ceil(v.duration*fps);for(let i=0;i<n;i++){let t=i/fps;await seek(t);latest=null;await pose.send({image:v});frames.push({t,pose:latest});s.textContent=`Кадр ${i+1} / ${n}`;await new Promise(r=>setTimeout(r,0))}s.textContent=`Готово: ${frames.filter(f=>f.pose).length} из ${n} кадров распознано.`}catch(e){s.textContent='Ошибка: '+e.message}finally{busy=false;$('run').disabled=$('file').disabled=false;$('save').disabled=!frames.some(f=>f.pose)}};$('save').onclick=()=>{const data={source:$('file').files[0].name,fps:30,width:v.videoWidth,height:v.videoHeight,frames};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='hero_motion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
</script></html>
